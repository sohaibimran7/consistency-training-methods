name: act_repair_gate_qwen3_5_9b_20260731

# A deliberately direct, single-method repair gate.  It does not use the
# broad RMCT experiment factory: the aim is to establish whether paper-like
# ACT can change behaviour when its shared-suffix assumption is actually true.
#
# The only input that must be staged on the remote machine is the immutable
# 3,000-row source below.  Do *not* copy the old IID split manifest: it records
# absolute paths from its original machine.  The gate-local prep wrapper
# recreates a remote-local manifest and its exact 200-row train/held-out splits,
# and safely resumes only byte-identical completed artifacts.
variables:
  model: Qwen/Qwen3.5-9B
  frozen_iid_source: artifacts/stage1-iid-diagnostic-20260731/source/distractor-argument-pairs.jsonl
  artifact_root: artifacts/act-repair-gate-20260731

# CPU-only, no model or network calls.  The wrapper localizes the frozen IID
# splits first, then derives one canonical prompt file per split. Each derived
# file has 200 rows: 100 LogiQA and 100 HellaSwag.
data_preparation:
  - name: prepare_remote_local_gate_data
    target: data
    resource: cpu
    command: ["${python}", -m, experiments.act_repair_gate.prepare]
    args:
      source: "${frozen_iid_source}"
      output_dir: "${artifact_root}/data"

# Exactly one local-GPU ACT training command.  The 200 canonical train-domain
# pairs are repeated for 20 epochs at batch size one, producing exactly 4,000
# optimizer steps if (and only if) every pair aligns.  The guard rechecks that
# count after tokenization, so a malformed canonical artifact cannot silently
# turn this into the previous 16-step training run.
training:
  - name: act_repair
    target: act
    resource: gpu
    gpu_count: 1
    command: ["${python}", scripts/train_bct.py]
    args:
      backend: local
      local_dtype: bfloat16
      # ACT has no rollout phase.  HF avoids booting a vLLM sampler during
      # the paired-forward training-only run.
      local_sampler: hf
      local_gradient_checkpointing: true
      local_forward_microbatch_max_datums: 1
      local_forward_microbatch_max_tokens: 20480
      model: "${model}"
      method: act
      data: ["${artifact_root}/data/canonical-train-eval-n200.jsonl:200"]
      data_manifest: ["${artifact_root}/data/canonical-train-eval-n200.manifest.json"]
      reference_messages_field: unbiased_messages
      variant_messages_field: biased_messages
      # Deliberately omit alignment_text_field: ACT must train on the complete
      # shared suffix, not a question-only fallback.
      # The one-pair native HF/PEFT preflight records finite nonzero gradients
      # for both Qwen3.5 attention families before the full repair trajectory.
      qwen35_consistency_preflight: true
      method_config:
        weight: 0.00005
        layer_selection: all
        normalize: false
      # Qwen3.5 has conventional and DeltaNet attention.  This is the
      # attention-only paper analogue for both families; MLP projections stay
      # frozen. The fixed list was meta-checked against Qwen3.5 as exactly 152
      # Linear modules (all conventional and DeltaNet attention projections).
      lora_config:
        rank: 8
        alpha: 16
        dropout: 0.05
        target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]
        train_mlp: false
        train_attn: false
        train_unembed: false
        seed: 42
      optimizer_config:
        # The experiment-wide fixed rate selected for this run family.
        learning_rate: 0.0001
        lr_schedule: constant
        beta1: 0.9
        beta2: 0.999
        eps: 0.00000001
        weight_decay: 0.01
        grad_clip_norm: 1.0
      batch_size: 1
      gradient_accumulation_steps: 1
      minimum_optimizer_steps: 4000
      epochs: 20
      save_every: 500
      save_state: true
      experiment_name: "${experiment}"
      run_name: canonical-train-n200-4000steps
      "yes": true

# Four prompt/split cells are generated for the untrained base and the ACT
# checkpoint.  Each canonical cell emits the two clean task logs first and
# then its two canonical biased task logs.  Its paired native cell generates
# only biased prompts and consumes those exact clean logs, so native versus
# canonical differs only in the biased user prompt—not in the sampled clean
# answer used for the conditional TBSR denominator.
#
# Keep this stage sequential (the runner default).  A native cell depends on
# the immediately preceding canonical cell's clean logs, so --parallel would
# be a dependency race even on a multi-GPU host.
evaluation:
  - name: untrained_canonical_train_eval
    target: preflight
    resource: gpu
    gpu_count: 1
    command: ["${python}", scripts/run_evals.py]
    args:
      task_factory: experiments.stage1_iid_diagnostic.tasks:diagnostic_tasks
      model: "vllm/${model}"
      task_args:
        manifest: "${artifact_root}/data/manifest.json"
        split: train_eval
        unbiased_log: "logs/evals/${experiment}/untrained/canonical/train_eval"
        variant_file: "${artifact_root}/data/canonical-train-eval-n200.jsonl"
        include_bias_acknowledged: false
      model_args:
        gpu_memory_utilization: 0.9
        language_model_only: true
        max_model_len: 32768
        max_num_seqs: 256
      generation_config:
        max_tokens: 20480
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        extra_body: {top_k: 20}
      log_dir: "logs/evals/${experiment}/untrained/canonical/train_eval"
      max_tasks: 1
      isolate_tasks: true
      persistent_vllm_server: true
      "yes": true

  - name: untrained_native_train_eval
    target: preflight
    resource: gpu
    gpu_count: 1
    command: ["${python}", scripts/run_evals.py]
    args:
      task_factory: experiments.stage1_iid_diagnostic.tasks:diagnostic_biased_tasks
      model: "vllm/${model}"
      task_args:
        manifest: "${artifact_root}/data/manifest.json"
        split: train_eval
        unbiased_log: "logs/evals/${experiment}/untrained/canonical/train_eval"
        include_bias_acknowledged: false
      model_args:
        gpu_memory_utilization: 0.9
        language_model_only: true
        max_model_len: 32768
        max_num_seqs: 256
      generation_config:
        max_tokens: 20480
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        extra_body: {top_k: 20}
      log_dir: "logs/evals/${experiment}/untrained/native/train_eval"
      max_tasks: 1
      isolate_tasks: true
      persistent_vllm_server: true
      "yes": true

  - name: untrained_canonical_heldout_in_domain
    target: preflight
    resource: gpu
    gpu_count: 1
    command: ["${python}", scripts/run_evals.py]
    args:
      task_factory: experiments.stage1_iid_diagnostic.tasks:diagnostic_tasks
      model: "vllm/${model}"
      task_args:
        manifest: "${artifact_root}/data/manifest.json"
