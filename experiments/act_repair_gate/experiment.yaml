# These are raw, deterministic reports only.  The shared gate analyzer rejects
# missing or duplicate cells and proves native/canonical comparability before
# emitting a report.  They run after the corresponding target's evaluations
# and before any optional Luna grading.
analysis:
  - name: analyze_untrained_raw_gate
    target: preflight
    resource: cpu
    command: ["${python}", -m, experiments.stage1_iid_diagnostic.gate_analysis]
    args:
      native_root: "logs/evals/${experiment}/untrained/native"
      canonical_root: "logs/evals/${experiment}/untrained/canonical"
      condition: untrained
      output: "${artifact_root}/analysis/untrained-raw.json"

  - name: analyze_act_raw_gate
    target: act
    resource: cpu
    command: ["${python}", -m, experiments.stage1_iid_diagnostic.gate_analysis]
    args:
      native_root: "logs/evals/${experiment}/act/native"
      canonical_root: "logs/evals/${experiment}/act/canonical"
      condition: act
      output: "${artifact_root}/analysis/act-raw.json"

# Render only the immutable local paired-switch reports.  This shares the main
# paper figure renderer and intentionally makes no model, OpenRouter, or Luna
# call.  It follows analysis so it cannot silently use incomplete raw logs.
rendering:
  - name: render_publication_style_tbsr
    target: act
    resource: cpu
    command: ["${python}", -m, experiments.act_repair_gate.plot]
    args:
      untrained_report: "${artifact_root}/analysis/untrained-raw.json"
      act_report: "${artifact_root}/analysis/act-raw.json"
      output_dir: "${artifact_root}/figures"
