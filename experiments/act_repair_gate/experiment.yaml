        unbiased_log: "logs/evals/${experiment}/untrained/canonical/heldout_in_domain"
        variant_file: "${artifact_root}/data/canonical-heldout-in-domain-n200.jsonl"
        include_bias_acknowledged: false
      model_args:
        gpu_memory_utilization: 0.9
        language_model_only: true
        max_model_len: 32768
        max_num_seqs: 256
      generation_config:
        max_tokens: 20480
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        extra_body: {top_k: 20}
      log_dir: "logs/evals/${experiment}/untrained/canonical/heldout_in_domain"
      max_tasks: 1
      isolate_tasks: true
      persistent_vllm_server: true
      "yes": true

  - name: untrained_native_heldout_in_domain
    target: preflight
    resource: gpu
    gpu_count: 1
    command: ["${python}", scripts/run_evals.py]
    args:
      task_factory: experiments.stage1_iid_diagnostic.tasks:diagnostic_biased_tasks
      model: "vllm/${model}"
      task_args:
        manifest: "${artifact_root}/data/manifest.json"
        split: heldout_in_domain
        unbiased_log: "logs/evals/${experiment}/untrained/canonical/heldout_in_domain"
        include_bias_acknowledged: false
      model_args:
        gpu_memory_utilization: 0.9
        language_model_only: true
        max_model_len: 32768
        max_num_seqs: 256
      generation_config:
        max_tokens: 20480
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        extra_body: {top_k: 20}
      log_dir: "logs/evals/${experiment}/untrained/native/heldout_in_domain"
      max_tasks: 1
      isolate_tasks: true
      persistent_vllm_server: true
      "yes": true

  # Before the expensive generated-answer evaluation, use a fixed 4-per-
  # dataset canonical slice (16 prompts across the two splits) to establish a
  # real native HF/PEFT behavioral movement.  The following CPU command
  # hashes the checkpoint, frozen sources, selected IDs, and report, and stops
  # this target if the adapter has not strictly reduced direct TBSR on the
  # training-domain portion of that tiny diagnostic.
  - name: act_hf_tiny_behavior_report
    target: act
    resource: gpu
    gpu_count: 1
    command: ["${python}", -m, experiments.act_repair_gate.direct_answer]
    args:
      model: "${model}"
      adapter: "${checkpoint}"
      train_data: "${artifact_root}/data/canonical-train-eval-n200.jsonl"
      heldout_data: "${artifact_root}/data/canonical-heldout-in-domain-n200.jsonl"
      output_dir: "${artifact_root}/tiny-hf-behavioral-gate/direct-answer"
      condition_name: act
      limit_per_dataset: 4

  - name: attest_act_hf_tiny_behavior
    target: act
    resource: cpu
    command: ["${python}", -m, experiments.act_repair_gate.behavioral_gate]
    args:
      report: "${artifact_root}/tiny-hf-behavioral-gate/direct-answer/report.json"
      adapter: "${checkpoint}"
      train_data: "${artifact_root}/data/canonical-train-eval-n200.jsonl"
      heldout_data: "${artifact_root}/data/canonical-heldout-in-domain-n200.jsonl"
      output: "${artifact_root}/tiny-hf-behavioral-gate/attestation.json"
      gate_split: train_eval
      min_base_switches: 1
      expected_limit_per_dataset: 4
      require_pass: true

  - name: act_canonical_train_eval
    target: act
    resource: gpu
    gpu_count: 1
    command: ["${python}", scripts/run_evals.py]
    args:
      task_factory: experiments.stage1_iid_diagnostic.tasks:diagnostic_tasks
      local_checkpoint: "${checkpoint}"
      base_model: "${model}"
      task_args:
        manifest: "${artifact_root}/data/manifest.json"
        split: train_eval
        unbiased_log: "logs/evals/${experiment}/act/canonical/train_eval"
        variant_file: "${artifact_root}/data/canonical-train-eval-n200.jsonl"
        include_bias_acknowledged: false
      model_args:
        provider: vllm
        gpu_memory_utilization: 0.9
        language_model_only: true
        max_model_len: 32768
        max_num_seqs: 256
      generation_config:
        max_tokens: 20480
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        extra_body: {top_k: 20}
      log_dir: "logs/evals/${experiment}/act/canonical/train_eval"
      max_tasks: 1
      isolate_tasks: true
      persistent_vllm_server: true
