name: rmct_paper_vast_dense_qwen3_5_9b_stage1
experiment_factory: scripts.rmct_paper_vast_more_methods.experiment_factory:compile_experiment

# Full-data/full-evaluation scientific screen. It keeps every requested method
# and control at one provisional common learning rate.
spec:
  model: Qwen/Qwen3.5-9B
  backend: local
  seed: 42
  artifact_root: artifacts/rmct-hle-qwen3.5-9b-dense-stage1
  figure_root: figures/rmct-hle-qwen3.5-9b-dense-stage1

  learning_rates:
    - {name: "1e-4", value: 0.0001}

  lora: {rank: 8, alpha: 16, dropout: 0.0, train_mlp: true, train_attn: true, train_unembed: false}
  local:
    dtype: bfloat16
    sampler: vllm
    # The coordinator/local engine remains colocated with the training model.
    gpu_memory_utilization: 0.34
    # Leave headroom for 20,480-token prompt-logprob scoring. vLLM otherwise
    # reserves almost the whole GPU for KV cache, while a 16,384-position
    # float32 full-vocabulary log-softmax needs roughly 15 GiB on Qwen3.5-9B.
    rollout_gpu_memory_utilization: 0.75
    vllm_language_model_only: true
    vllm_max_num_seqs: 256
    # Bounds vLLM prompt-logprob workspaces: at 16,384 positions Qwen3.5's
    # float32 full-vocabulary log-softmax alone needs ~15.2 GiB. 8,192 keeps
    # each scoring block below ~7.6 GiB without affecting the 20,480-token cap.
    vllm_max_num_batched_tokens: 8192
    vllm_max_model_len: 32768
    gradient_checkpointing: true
    # At 20,480 tokens on H200, checkpointing the first 16/32 backbone layers
    # completed in 3.1091 s versus 3.5816 s for all-layer checkpointing; the
    # uncheckpointed comparison OOMed on the 141 GB device.
    gradient_checkpointing_layers: 16
    forward_microbatch_max_datums: 8
    # Physical padded-token budget, not a sequence-length cap. A 20,480-token
    # datum is indivisible and always runs through the full backbone end to end.
    # The 20,480 budget permits opportunistic pairing only for shorter outputs.
    forward_microbatch_max_tokens: 20480
    # H200 selected-token-head sweep: 2,048 avoids full sequence×vocabulary
    # logits while a full 20,480-token backbone F/B takes 3.58 s steady-state
    # and reserves ~35.5 GB. Larger head chunks save little additional time.
    target_logprob_chunk_size: 2048

  # Execution-only node allocations. Each --target writes an isolated resolved
  # plan/output state; stage1-coordinator publishes checkpoints once all eight
  # training targets are complete. GPU indices below are logical inside the
  # bundle assigned by scripts/run_experiment.py.
  execution:
    publication_owner: stage1-coordinator
    allocations:
      - target: data-preparation
        stage: data_preparation
        commands: [canonical-consistency-pairs]
      - target: data-preparation
        stage: data_preparation
        commands: [bias-augmented-consistency-targets, instruction-targets]
        gpu_count: 4
        # Target generation has no GPU coordinator: all four logical GPUs are
        # independent enable_lora=False vLLM workers.
        rollout_gpus: [0, 1, 2, 3]
      - target: rmct-main
        stage: training
        commands: [rate_matching_lr1]
        gpu_count: 8
        local_device: cuda:0
        rollout_gpus: [1, 2, 3, 4, 5, 6, 7]
        # RMCT's PPO+KL backward retains more state than fused OPCT. The first
        # production 20K-cap batch exhausted H200 memory with selective-16;
        # full-layer recomputation is the exact-loss, validated low-memory path.
        gradient_checkpointing_layers: all
      - target: rmct-control
        stage: training
        commands: [rate_matching_control_lr1]
        gpu_count: 8
        local_device: cuda:0
        rollout_gpus: [1, 2, 3, 4, 5, 6, 7]
        gradient_checkpointing_layers: all
      - target: bct-main
        stage: training
        commands: [bias_augmented_consistency_lr1]
        gpu_count: 1
        # Execution-only memory policy for the 80 GB A100 workers. Full-layer
        # checkpointing preserves the exact objective and fits the 20,480 cap.
        gradient_checkpointing_layers: all
      - target: bct-control
        stage: training
        commands: [bias_augmented_consistency_control_lr1]
        gpu_count: 1
        gradient_checkpointing_layers: all
      - target: act
        stage: training
        commands: [act_lr1]
        gpu_count: 1
      - target: attct
        stage: training
        commands: [attct_lr1]
        gpu_count: 1
      - target: mlpct
        stage: training
        commands: [mlpct_lr1]
        gpu_count: 1
      - target: opct
        stage: training
        commands: [opct_lr1]
        gpu_count: 8
        local_device: cuda:0
        rollout_gpus: [1, 2, 3, 4, 5, 6, 7]
        # Production selective-16 reached 139.46 GiB and OOMed while scoring a
        # long rollout. Full-layer recomputation preserves the exact objective
        # and was validated at 35.56 GiB reserved on the same H200 shape.
        gradient_checkpointing_layers: all
      - target: evaluation
        stage: evaluation
        commands: [untrained, rate-matching-lr1, rate-matching-control-lr1, bias-augmented-consistency-lr1, bias-augmented-consistency-control-lr1, act-lr1, attct-lr1, mlpct-lr1, opct-lr1]
        gpu_count: 1

  data:
    shared_root: artifacts/rmct-hle-dense-models-shared
    prepare_shared: false
    training:
      bias_type: wrong_argument
      datasets: [logiqa, hellaswag]
      prompt_style: encourage_cot
      pool_per_dataset: 1500
      minimum_per_dataset: 1024
      examples: 2048
      argument_model: openrouter/google/gemma-4-31b-it
    instruction: {source: cleaned_alpaca, examples: 2048}
    evaluation:
      source: hle
      expected_source_count: 513
      questions: 100
      biases: [suggested_answer, distractor_fact, wrong_argument, post_hoc, spurious_few_shot_squares, wrong_few_shot]
      # The canonical wrong-argument store contains 92 accepted generations.
      # All five deterministic bias transforms still evaluate the full 100.
      minimum_questions_by_bias: {wrong_argument: 92}
      argument_model: openrouter/google/gemma-4-31b-it
      grader_model: openrouter/google/gemma-4-31b-it

  conditions:
    - {name: untrained, method: none}
    - {name: rate-matching, method: rate_matching}
    - {name: rate-matching-control, method: rate_matching, control: true}
    - {name: bias-augmented-consistency, method: bias_augmented_consistency}
    - {name: bias-augmented-consistency-control, method: bias_augmented_consistency, control: true}
    - {name: act, method: act}
    - {name: attct, method: attct}
    - {name: mlpct, method: mlpct}
    - {name: opct, method: opct}

  supervised_consistency:
    batch_size: 1
    gradient_accumulation_steps: 128
    epochs: 1
    save_every: 16
    learning_rate_schedule: linear
    bias_augmented_targets: {max_tokens: 20480, temperature: 1.0, max_concurrency: 32}
    method_config:
      act: {layer_selection: all, normalize: false}
      attct: {layer_selection: all, layer_weights: uniform}
      mlpct: {variant: hidden, layer_selection: all, layer_weights: uniform, distance_metric: cosine, normalize: false}

  opct:
    learning_rates:
      - {name: "1e-4", value: 0.0001}
    batch_size: 1
    gradient_accumulation_steps: 16
    epochs: 1
    rollouts_per_prompt: 4
    temperature: 0.7
    max_new_tokens: 20480
    learning_rate_schedule: constant
    kl_coefficient: 2.0
    kl_discount_factor: 0.9
    loss: importance_sampling
    checkpoint_every: 8

  rate_matching:
    datapoints: 64
    rollouts: {reference: 96, training: 96, consistency: 96, anchor: 128}
    batch_size: 1
    epochs: 1
    temperature: 1.0
    max_new_tokens: 20480
    learning_rate_schedule: constant
    kl_coefficient: 0.05
    anchor_weight: 0.0
    anchor_model: base
    loss: ppo
    advantage_estimator: grpo_normalized
    normalization: per_item
    gradient_accumulation_steps: 4
    refresh_every: 1
    checkpoint_every: 8

  evaluation:
    max_tokens: 20480
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    provider: vllm
    max_tasks: 1
    isolate_tasks: true
    persistent_vllm_server: true
    model_args: {gpu_memory_utilization: 0.9, max_model_len: 32768, language_model_only: true, max_num_seqs: 256}
  tracking: {wandb_project: rmct_paper_vast_dense_models_stage1}

  reports:
    held_out_exclude: [wrong_argument]
    standard_error: inspect
    significance_baseline: untrained
    charts:
      switch: experiments/rmct_paper_vast_more_methods/switch_chart.json
      away-switch: experiments/rmct_paper_vast_more_methods/away_switch_chart.json
      total-switch: experiments/rmct_paper_vast_more_methods/total_switch_chart.json
      accuracy: experiments/rmct_paper_vast_more_methods/unbiased_accuracy_chart.json
      verbalisation: experiments/rmct_paper_vast_more_methods/verbalisation_chart.json
    items:
      - {name: towards-bias-switch, metric: towards_bias_switch, chart: switch}
      - {name: bias-verbalised, metric: bias_acknowledged, chart: verbalisation}
      - {name: bias-verbalised-given-towards-bias-switch, metric: bias_acknowledged, given: towards_bias_switch, chart: verbalisation}
      - name: bias-verbalised-given-total-bias-switch
        metric: bias_acknowledged
        where: {metric: abs_switch, op: gt, value: 0}
        chart: verbalisation
      - {name: away-from-bias-switch, metric: away_from_bias_switch, chart: away-switch}
      - {name: total-bias-switch, metric: total_bias_switch, chart: total-switch}
      - {name: unbiased-accuracy, metric: correct, variant: unbiased, held_out_summary: false, chart: accuracy}
