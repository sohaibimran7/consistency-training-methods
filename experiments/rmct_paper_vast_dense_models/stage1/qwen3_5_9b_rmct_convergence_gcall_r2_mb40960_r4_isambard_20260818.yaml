name: rmct-convergence
experiment_factory: experiments.rmct_convergence_r4_recovery.plan:compile_experiment

# Immutable fresh recovery from the sealed r3 s004 checkpoint at optimizer
# step 64.  Failed Slurm job 6031786 supplies provenance only: its state is
# never resumed.  Relative to r3, the sole runtime change is the physical
# padded-token forward-microbatch cap (49,152 -> 40,960).
