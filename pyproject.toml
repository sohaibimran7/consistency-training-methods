[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "consistency-training-methods"
version = "0.1.0"
description = "Modular reinforcement, supervised, and representation-consistency training"
requires-python = ">=3.11"
# requirements.txt is the single dependency source of truth for this research
# repository. The package is installed with --no-deps after that environment.
dependencies = []

[tool.setuptools.packages.find]
include = ["ctm*", "ctm_data", "ctm_data.adapters*", "ctm_data.sources*"]
exclude = ["ctm_data.adapters.*.tests*"]
namespaces = false

[tool.black]
line-length = 120
target-version = ['py311']
extend-exclude = '(^|/)(_archive|\.claude/worktrees)/'

[tool.ruff]
line-length = 300
extend-exclude = ["_archive", ".claude/worktrees"]

[tool.pytest.ini_options]
testpaths = ["tests", "ctm_data/adapters"]
pythonpath = ["."]
norecursedirs = ["_archive", "*/_archive"]
markers = [
    "network: needs live API access",
    "gpu: needs a GPU",
    "tinker: needs the live Tinker service / a checkpoint",
]
addopts = "-m 'not network and not gpu and not tinker'"

[tool.ruff.lint.extend-per-file-ignores]
"scripts/*" = ["E402", "E501"]  # load_dotenv(PROJECT_ROOT/.env) must run before ctm imports
