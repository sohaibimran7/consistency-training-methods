name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-offline:
    name: Linux x86_64 CPython 3.11 offline suite
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      PYTHONNOUSERSITE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: offline
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up CPython 3.11.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.12
          check-latest: false

      - name: Set up uv 0.8.22
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: 0.8.22
          enable-cache: false

      - name: Check the committed lock contract
        run: python scripts/check_environment.py --lock-only

      - name: Create the isolated validation environment
        run: uv venv .venv --python python

      - name: Install locked dependencies
        run: uv pip sync --python .venv/bin/python --strict --torch-backend cpu environments/cpu.lock

      - name: Install the repository package without changing dependencies
        run: uv pip install --python .venv/bin/python --editable . --no-deps

      - name: Check the installed environment contract
        run: .venv/bin/python scripts/check_environment.py

      - name: Run the full default offline suite
        run: .venv/bin/python -m pytest

      - name: Run source-boundary tests explicitly
        run: .venv/bin/python -m pytest tests/test_ctm_architecture.py
