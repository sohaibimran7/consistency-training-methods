name: lr_hp_gpt20b_rlct_sa_lr1e4_r64_n128
model: openai/gpt-oss-20b
training:
  method: rl
  include_control: false
  args:
    experiment_name: lr_hp_gpt20b_rlct_sa_lr1e4_r64_n128
    run_name: gpt-oss-20b-rlct-sa-lr1e4-r64-n128
    bias_types: suggested_answer
    datasets: truthfulqa
    n_datapoints: 128
    prompt_style: no_cot
    lr: 0.0001
    lr_schedule: constant
    lora_rank: 8
    kl_coef: 0.05
    anchor_weight: 0.0
    anchor_model: base
    loss_fn: ppo
    n_ref_rollouts: 64
    n_train_rollouts: 64
    n_consistency_rollouts: 64
    n_anchor_rollouts: 64
    temperature: 1.0
    max_new_tokens: 24576
    n_epochs: 1
    batch_size: 8
    gradient_accumulation_steps: 1
    refresh_every: 1
    checkpoint_every: 8
evaluation:
  include_base: false
  intermediate_steps:
  - 8
  args:
    bias_types: wrong_few_shot,spurious_few_shot_squares,distractor_fact,distractor_argument
    datasets: truthfulqa
    prompt_styles: no_cot
    limit: 200
    max_tokens: 24576
    max_tasks: 50
    log_dir: artifacts/eval_suites/lr_hparam_truthfulqa/eval_logs
    hash_file: artifacts/eval_suites/lr_hparam_truthfulqa/eval_logs/common_hashes.json
analysis:
  args:
    bir: true
    ba: true
    plot: true
    no_controls: true
    output_dir: artifacts/eval_suites/lr_hparam_truthfulqa/plots
viz_registration:
  dir_suffix: rlct-sa-lr1e4-r64-n128
  training_type: rlct_sa_lr1e4_r64_n128
  display_name: GPT RLCT lr=0.0001 r=64 n=128
  color: '#31a354'
  training_biases:
  - suggested_answer
  extra_models:
  - dir_suffix: rlct-sa-lr1e4-r64-n128-step8
    training_type: rlct_sa_lr1e4_r64_n128_step8
    display_name: GPT RLCT lr=0.0001 r=64 n=64
    color: '#a1d99b'
    training_biases:
    - suggested_answer
