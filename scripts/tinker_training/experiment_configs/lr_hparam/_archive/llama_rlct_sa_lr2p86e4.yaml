name: lr_hp_llama_rlct_sa_lr2p86e4
model: meta-llama/Llama-3.1-8B-Instruct
training:
  method: rl
  include_control: false
  args:
    experiment_name: lr_hp_llama_rlct_sa_lr2p86e4
    run_name: llama-rlct-sa-lr2p86e4
    bias_types: suggested_answer
    datasets: mmlu
    n_datapoints: 128
    prompt_style: cot
    lr: 0.000286
    lr_schedule: constant
    lora_rank: 8
    kl_coef: 0.05
    anchor_weight: 0.0
    anchor_model: base
    loss_fn: ppo
    n_ref_rollouts: 32
    n_train_rollouts: 32
    n_consistency_rollouts: 32
    n_anchor_rollouts: 32
    temperature: 1.0
    max_new_tokens: 16384
    n_epochs: 1
    batch_size: 8
    gradient_accumulation_steps: 1
    refresh_every: 1
    checkpoint_every: 0
evaluation:
  include_base: false
  args:
    bias_types: suggested_answer,wrong_few_shot,spurious_few_shot_squares,distractor_fact,distractor_argument
    datasets: truthfulqa
    prompt_styles: cot
    limit: 200
    max_tokens: 16384
    max_tasks: 50
    log_dir: artifacts/eval_suites/lr_hparam_truthfulqa/eval_logs
    hash_file: artifacts/eval_suites/lr_hparam_truthfulqa/eval_logs/common_hashes.json
analysis:
  args:
    bir: true
    ba: true
    plot: true
    no_controls: true
    output_dir: artifacts/eval_suites/lr_hparam_truthfulqa/plots
viz_registration:
  dir_suffix: rlct-sa-lr2p86e4
  training_type: rlct_sa_lr2p86e4
  display_name: Llama RLCT lr=0.000286
  color: '#238b45'
  training_biases:
  - suggested_answer
