name: lr_hp_llama_bct_sa_lr2p86e4
model: meta-llama/Llama-3.1-8B-Instruct
training:
  method: sft
  include_control: false
  args:
    experiment_name: lr_hp_llama_bct_sa_lr2p86e4
    run_name: llama-bct-sa-lr2p86e4
    data: dataset_dumps/train-from-test-mmlu/sa/llama_3_1_8b_instruct/bct_cot.jsonl
    batch_size: 128
    epochs: 1
    lr: 0.000286
    lora_rank: 8
    save_every: 9999
evaluation:
  include_base: false
  args:
    bias_types: suggested_answer,wrong_few_shot,spurious_few_shot_squares,distractor_fact,distractor_argument
    datasets: truthfulqa
    prompt_styles: cot
    limit: 200
    max_tokens: 16384
    max_tasks: 50
    log_dir: artifacts/eval_suites/lr_hparam_truthfulqa/eval_logs
    hash_file: artifacts/eval_suites/lr_hparam_truthfulqa/eval_logs/common_hashes.json
analysis:
  args:
    bir: true
    ba: true
    plot: true
    no_controls: true
    output_dir: artifacts/eval_suites/lr_hparam_truthfulqa/plots
viz_registration:
  dir_suffix: bct-sa-lr2p86e4
  training_type: bct_sa_lr2p86e4
  display_name: Llama BCT lr=0.000286
  color: '#2171b5'
  training_biases:
  - suggested_answer
