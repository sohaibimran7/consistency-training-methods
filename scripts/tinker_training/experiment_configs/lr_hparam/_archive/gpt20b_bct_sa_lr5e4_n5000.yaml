name: lr_hp_gpt20b_bct_sa_lr5e4_n5000
model: openai/gpt-oss-20b
training:
  method: sft
  include_control: false
  args:
    experiment_name: lr_hp_gpt20b_bct_sa_lr5e4_n5000
    run_name: gpt-oss-20b-bct-sa-lr5e4-n5000
    data: dataset_dumps/train-from-test-truthfulqa/sa/gpt_oss_20b/bct_non_cot_repeat_5000.jsonl
    batch_size: 128
    epochs: 1
    lr: 0.0005
    lora_rank: 8
    save_every: 9999
evaluation:
  include_base: false
  args:
    bias_types: wrong_few_shot,spurious_few_shot_squares,distractor_fact,distractor_argument
    datasets: truthfulqa
    prompt_styles: no_cot
    limit: 200
    max_tokens: 24576
    max_tasks: 50
    log_dir: artifacts/eval_suites/lr_hparam_truthfulqa/eval_logs
    hash_file: artifacts/eval_suites/lr_hparam_truthfulqa/eval_logs/common_hashes.json
analysis:
  args:
    bir: true
    ba: true
    plot: true
    no_controls: true
    output_dir: artifacts/eval_suites/lr_hparam_truthfulqa/plots
viz_registration:
  dir_suffix: bct-sa-lr5e4-n5000
  training_type: bct_sa_lr5e4_n5000
  display_name: GPT BCT lr=0.0005 n=5000
  color: '#3182bd'
  training_biases:
  - suggested_answer
